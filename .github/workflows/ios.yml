name: iOS Build & Unit Tests

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ios-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Unit Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select destination
        id: dest
        run: |
          # Resolve a concrete simulator UDID. Prefer an iPhone running iOS;
          # fall back to a visionOS simulator (Designed for iPad,iPhone) if no
          # iOS runtime is installed on the runner image.
          SIM_JSON=$(xcrun simctl list devices available -j 2>/dev/null)

          IOS_ID=$(echo "$SIM_JSON" \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("iPhone"))) | .udid' \
            | head -1)

          if [ -n "$IOS_ID" ]; then
            DEST="platform=iOS Simulator,id=$IOS_ID"
          else
            VISION_ID=$(echo "$SIM_JSON" \
              | jq -r '.devices | to_entries[] | select(.key | test("visionOS|xrOS")) | .value[] | select(.isAvailable) | .udid' \
              | head -1)
            if [ -z "$VISION_ID" ]; then
              echo "No iOS or visionOS simulator available on this runner." >&2
              echo "Installed runtimes:" >&2
              xcrun simctl list runtimes >&2
              exit 1
            fi
            DEST="platform=visionOS Simulator,id=$VISION_ID"
          fi

          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Selected destination: $DEST"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Boot simulator
        run: |
          ID=$(echo "${{ steps.dest.outputs.destination }}" | grep -oE 'id=[^,]+' | cut -d= -f2)
          xcrun simctl boot "$ID" 2>/dev/null || true

      - name: Unit tests
        run: |
          # Run ParlanceTests only — full UI tests live in a separate
          # manual-trigger workflow (.github/workflows/ios-ui.yml). The
          # launch-test smoke step below covers the boots-without-crashing
          # case for every PR.
          xcodebuild test-without-building \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            -only-testing:ParlanceTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: UI launch tests
        run: |
          # Two-test smoke suite (~10s) that just boots the app + screenshots
          # it. Catches catastrophic startup regressions without the
          # SwiftUI-focus / Supabase flakes of the full UI suite.
          xcodebuild test-without-building \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            -only-testing:ParlanceUITests/ParlanceUITestsLaunchTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Release build
        run: |
          # Catches optimizer-only regressions (dead-code elimination,
          # ObjC bridging, inlined-stripped APIs) that Debug builds let pass.
          xcodebuild build \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -configuration Release \
            -destination "${{ steps.dest.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
