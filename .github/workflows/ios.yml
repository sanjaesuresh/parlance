name: iOS Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select destination
        id: dest
        run: |
          # Only consider an iOS simulator if the runtime is actually installed.
          # xcrun simctl list devices returns records even for runtimes that are
          # not installed; xcrun simctl list runtimes tells us what's really there.
          IOS_RUNTIME=$(xcrun simctl list runtimes available 2>/dev/null \
            | grep "^iOS" | grep -v "unavailable" | head -1 \
            | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+" || true)

          DEST=""
          if [ -n "$IOS_RUNTIME" ]; then
            IOS_ID=$(xcrun simctl list devices available "$IOS_RUNTIME" 2>/dev/null \
              | grep "iPhone" | grep -v "unavailable" | head -1 \
              | grep -oE "[0-9A-F-]{36}" || true)
            [ -n "$IOS_ID" ] && DEST="platform=iOS Simulator,id=$IOS_ID"
          fi

          if [ -z "$DEST" ]; then
            # Fall back to visionOS simulator (supports Designed for iPad,iPhone)
            VISION_ID=$(xcrun simctl list devices available -j 2>/dev/null \
              | python3 -c "
import json, sys
d = json.load(sys.stdin)
for runtime, devices in d['devices'].items():
    if 'visionOS' in runtime:
        for dev in devices:
            if dev.get('isAvailable'):
                print(dev['udid']); exit()
" || true)
            DEST="platform=visionOS Simulator,id=$VISION_ID"
          fi

          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Selected destination: $DEST"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Boot simulator
        run: |
          ID=$(echo "${{ steps.dest.outputs.destination }}" | grep -oE 'id=[^,]+' | cut -d= -f2)
          xcrun simctl boot "$ID" 2>/dev/null || true

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
