name: iOS UI Tests

# Full end-to-end UI tests. Slow (~20 min) and dependent on external
# Supabase state, so they're MANUAL-ONLY — run them before releases or
# when explicitly investigating a UI regression. Per-PR smoke coverage
# is handled by the launch-tests step in ios.yml.

on:
  workflow_dispatch:

concurrency:
  group: ios-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: UI Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select destination
        id: dest
        run: |
          SIM_JSON=$(xcrun simctl list devices available -j 2>/dev/null)

          IOS_ID=$(echo "$SIM_JSON" \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("iPhone"))) | .udid' \
            | head -1)

          if [ -n "$IOS_ID" ]; then
            DEST="platform=iOS Simulator,id=$IOS_ID"
          else
            VISION_ID=$(echo "$SIM_JSON" \
              | jq -r '.devices | to_entries[] | select(.key | test("visionOS|xrOS")) | .value[] | select(.isAvailable) | .udid' \
              | head -1)
            if [ -z "$VISION_ID" ]; then
              echo "No iOS or visionOS simulator available on this runner." >&2
              echo "Installed runtimes:" >&2
              xcrun simctl list runtimes >&2
              exit 1
            fi
            DEST="platform=visionOS Simulator,id=$VISION_ID"
          fi

          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Selected destination: $DEST"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Boot simulator
        run: |
          ID=$(echo "${{ steps.dest.outputs.destination }}" | grep -oE 'id=[^,]+' | cut -d= -f2)
          xcrun simctl boot "$ID" 2>/dev/null || true

      - name: UI tests
        run: |
          xcodebuild test-without-building \
            -project ParlanceApp/Parlance.xcodeproj \
            -scheme Parlance \
            -destination "${{ steps.dest.outputs.destination }}" \
            -only-testing:ParlanceUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
