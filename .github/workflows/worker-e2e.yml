name: Cloudflare Worker E2E Tests

# Hits the live Gemini API and burns quota — manual-only. Requires
# GEMINI_API_KEY in repo secrets; the job no-ops gracefully when absent.

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: worker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for GEMINI_API_KEY
        id: secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not set — skipping e2e run." >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        working-directory: cloudflare-worker
        run: npm ci

      - name: Run e2e tests
        if: steps.secret.outputs.present == 'true'
        working-directory: cloudflare-worker
        env:
          RUN_E2E: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx vitest run tests/realLifeTips.e2e.test.js
