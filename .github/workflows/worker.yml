name: Cloudflare Worker Tests

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Run unit tests
        working-directory: cloudflare-worker
        run: npm test
